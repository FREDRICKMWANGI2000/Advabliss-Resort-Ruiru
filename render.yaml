services:
  - type: web
    name: advabliss-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_TO
        value: fredifytechnologies@gmail.com
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: RESEND_CONTACT_TEMPLATE_ID
        value: website-enquiry-notification
      - key: RESEND_ACCOMMODATION_TEMPLATE_ID
        value: reservation-inquiry
      - key: RESEND_RESTAURANT_TEMPLATE_ID
        value: table-reservation-notice
      - key: RESEND_MEETING_TEMPLATE_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://advabliss-resort-ruiru.vercel.app,https://advabliss.com,https://www.advabliss.com
